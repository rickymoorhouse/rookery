name: Post comment replies

# Posts reviewed replies as Rook: replies/*.md to their comment issues on
# GitHub, replies/bluesky/*.md to their Bluesky threads and replies/x/*.md to
# their X threads.
on:
  push:
    branches: [main]
    paths: ['replies/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-replies


jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/post-replies.mjs
        env:
          ROOK_GITHUB_TOKEN: ${{ secrets.ROOK_GITHUB_TOKEN }}
      - run: node scripts/post-bluesky.mjs
        if: success() || failure()
        env:
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      - run: node scripts/post-x.mjs
        if: success() || failure()
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      - run: node scripts/post-mastodon.mjs
        if: success() || failure()
        env:
          MASTODON_INSTANCE: ${{ vars.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
