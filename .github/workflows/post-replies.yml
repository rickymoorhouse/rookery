name: Post comment replies

# Posts reviewed replies as Rook: replies/*.md to their comment issues on
# GitHub, and replies/bluesky/*.md to their Bluesky threads.
on:
  push:
    branches: [main]
    paths: ['replies/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-replies

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/post-replies.mjs
        env:
          ROOK_GITHUB_TOKEN: ${{ secrets.ROOK_GITHUB_TOKEN }}
      - run: node scripts/post-bluesky.mjs
        if: success() || failure()
        env:
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
